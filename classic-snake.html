<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  :root {
    --bg: #10141a;
    --panel: #171d26;
    --grid: #1d2530;
    --text: #e6edf3;
    --muted: #8b98a8;
    --snake: #f472b6;
    --head: #fbcfe8;
    --food: #fde047;
    --leaf: #84cc16;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex;
    padding: 16px;
  }
  /* Keep the whole board on screen in short windows */
  main { width: min(100%, 480px, 100vh - 120px); min-width: 220px; margin: auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }
  h1 { font-size: 20px; margin: 0; letter-spacing: 0.15em; }
  .scores { display: flex; gap: 20px; font-size: 14px; color: var(--muted); }
  .scores b { color: var(--text); font-variant-numeric: tabular-nums; }
  .board { position: relative; }
  canvas {
    display: block;
    width: 100%;
    aspect-ratio: 1;
    background: var(--panel);
    border-radius: 10px;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(16, 20, 26, 0.78);
    border-radius: 10px;
    text-align: center;
  }
  .overlay[hidden] { display: none; }
  .overlay h2 { margin: 0; font-size: 26px; }
  .overlay p { margin: 0; color: var(--muted); font-size: 14px; }
  button {
    font: inherit;
    color: #2a0f1d;
    background: var(--snake);
    border: 0;
    border-radius: 8px;
    padding: 10px 22px;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  button:focus-visible { outline: 2px solid var(--head); outline-offset: 3px; }
  footer { margin-top: 12px; font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>SNAKE</h1>
    <div class="scores">
      <span>Score <b id="score">0</b></span>
      <span>Best <b id="best">0</b></span>
    </div>
  </header>
  <div class="board">
    <canvas id="game" width="480" height="480"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">Snake</h2>
      <p id="overlay-text">Eat the lemons. Don't hit the walls or yourself.</p>
      <button id="start">Play</button>
    </div>
  </div>
  <footer>Arrow keys / WASD or swipe to move · Space to pause</footer>
</main>

<script>
(() => {
  const CELLS = 20;
  const START_DELAY = 140;
  const MIN_DELAY = 60;
  const SPEEDUP = 3;

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayText = document.getElementById('overlay-text');
  const startBtn = document.getElementById('start');

  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const colors = { grid: css('--grid'), snake: css('--snake'), head: css('--head'), food: css('--food'), leaf: css('--leaf') };
  const size = canvas.width / CELLS;

  let snake, dir, queue, food, score, delay, state, last, acc;
  let best = 0;
  try { best = Number(localStorage.getItem('snake-best')) || 0; } catch {}
  bestEl.textContent = best;

  function reset() {
    const mid = Math.floor(CELLS / 2);
    snake = [{ x: mid, y: mid }, { x: mid - 1, y: mid }, { x: mid - 2, y: mid }];
    dir = { x: 1, y: 0 };
    queue = [];
    score = 0;
    delay = START_DELAY;
    scoreEl.textContent = 0;
    placeFood();
  }

  function placeFood() {
    const free = [];
    for (let y = 0; y < CELLS; y++) {
      for (let x = 0; x < CELLS; x++) {
        if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
      }
    }
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  function turn(x, y) {
    if (state !== 'playing') return;
    const prev = queue.length ? queue[queue.length - 1] : dir;
    // Ignore reversals and repeats of the current heading
    if (prev.x === x && prev.y === y) return;
    if (prev.x === -x && prev.y === -y) return;
    if (queue.length < 2) queue.push({ x, y });
  }

  function step() {
    if (queue.length) dir = queue.shift();
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    const eating = food && head.x === food.x && head.y === food.y;
    // The tail moves away this tick unless we're growing, so it isn't an obstacle
    const body = eating ? snake : snake.slice(0, -1);

    if (head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS ||
        body.some(s => s.x === head.x && s.y === head.y)) {
      return end('Game over');
    }

    snake.unshift(head);
    if (eating) {
      score++;
      scoreEl.textContent = score;
      delay = Math.max(MIN_DELAY, delay - SPEEDUP);
      placeFood();
      if (!food) return end('You win!');
    } else {
      snake.pop();
    }
  }

  function end(title) {
    state = 'over';
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('snake-best', best); } catch {}
    }
    show(title, `Score: ${score}`, 'Play again');
  }

  function show(title, text, label) {
    overlayTitle.textContent = title;
    overlayText.textContent = text;
    startBtn.textContent = label;
    overlay.hidden = false;
    startBtn.focus();
  }

  function drawLemon(cx, cy) {
    const rx = size * 0.4, ry = size * 0.29;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-Math.PI / 5);
    ctx.fillStyle = colors.food;
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
    // Pointed tips at each end
    ctx.beginPath();
    ctx.arc(-rx, 0, size * 0.09, 0, Math.PI * 2);
    ctx.arc(rx, 0, size * 0.09, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = colors.leaf;
    ctx.beginPath();
    ctx.ellipse(rx * 0.75, -ry * 1.05, size * 0.15, size * 0.07, -Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = colors.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < CELLS; i++) {
      ctx.moveTo(i * size + 0.5, 0); ctx.lineTo(i * size + 0.5, canvas.height);
      ctx.moveTo(0, i * size + 0.5); ctx.lineTo(canvas.width, i * size + 0.5);
    }
    ctx.stroke();

    if (food) {
      drawLemon((food.x + 0.5) * size, (food.y + 0.5) * size);
    }

    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? colors.head : colors.snake;
      ctx.beginPath();
      ctx.roundRect(s.x * size + 1.5, s.y * size + 1.5, size - 3, size - 3, 5);
      ctx.fill();
    });
  }

  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(now - last, 250);
    last = now;
    if (state !== 'playing') return;
    acc += dt;
    while (acc >= delay && state === 'playing') {
      acc -= delay;
      step();
    }
    draw();
  }

  function start() {
    reset();
    state = 'playing';
    acc = 0;
    overlay.hidden = true;
    draw();
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      show('Paused', 'Press Space to continue', 'Resume');
    } else if (state === 'paused') {
      state = 'playing';
      acc = 0;
      overlay.hidden = true;
    }
  }

  const KEYS = {
    ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
    ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
    ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
    ArrowRight: [1, 0], d: [1, 0], D: [1, 0],
  };

  addEventListener('keydown', e => {
    if (e.key === ' ') {
      e.preventDefault();
      if (state === 'playing' || state === 'paused') togglePause();
      else start();
      return;
    }
    if (e.key === 'Enter' && state !== 'playing' && state !== 'paused') {
      e.preventDefault();
      start();
      return;
    }
    const k = KEYS[e.key];
    if (k) {
      e.preventDefault();
      turn(k[0], k[1]);
    }
  });

  startBtn.addEventListener('click', () => {
    if (state === 'paused') togglePause();
    else start();
  });

  let touch = null;
  canvas.addEventListener('pointerdown', e => { touch = { x: e.clientX, y: e.clientY }; });
  canvas.addEventListener('pointermove', e => {
    if (!touch) return;
    const dx = e.clientX - touch.x, dy = e.clientY - touch.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0);
    else turn(0, Math.sign(dy));
    touch = { x: e.clientX, y: e.clientY };
  });
  addEventListener('pointerup', () => { touch = null; });
  addEventListener('blur', () => { if (state === 'playing') togglePause(); });

  reset();
  state = 'ready';
  draw();
  last = performance.now();
  acc = 0;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
